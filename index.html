<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fyo Aqua Garden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:       #e9f1e3;
    --panel:    #ffffff;
    --line:     #dbe6d4;
    --line-2:   #e6ede0;
    --text:     #2b3a33;
    --muted:    #7c8c81;
    --dark-sep: #2b3a33;

    --plants:   #5e9b6e;
    --plants-t: #e7f2e6;

    --radius: 14px;
  }

  html[data-theme="dark"]{
    --bg:       #24262a;
    --panel:    #2e3136;
    --line:     #3d4146;
    --line-2:   #3a3e43;
    --text:     #e7e8ea;
    --muted:    #9a9ea3;
    --dark-sep: #46494e;

    --plants-t: #33392f;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--text); font-family:'Manrope', sans-serif; min-height:100vh; }
  html{ transition: background 0.15s ease; }
  body, .topbar, .sidebar, .card, .home-card, .doc-page, .g-tile, .btn-secondary, .fmt-btn{ transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease; }
  ::selection{ background: var(--plants-t); color: var(--text); }

  h1,h2,h3,.display{ font-family:'Fraunces', serif; font-weight:500; letter-spacing:-0.01em; }

  button, input, select, textarea{ font-family: inherit; }

  /* ---------- top bar ---------- */
  .topbar{
    display:flex; align-items:center; gap:14px;
    padding: 16px 30px; background: var(--panel);
    border-bottom: 3px solid var(--dark-sep);
  }
  .topbar .brand{
    all:unset; cursor:pointer; font-family:'Fraunces', serif; font-weight:500;
    font-size: 1.6rem; color: var(--text);
  }
  .topbar .brand:hover{ color: var(--plants); }
  .topbar .spacer{ flex:1; }

  .auth-btn{
    all:unset; cursor:pointer; font-size:0.85rem; font-weight:600;
    padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text);
  }
  .auth-btn:hover{ border-color: var(--muted); }

  .theme-toggle{
    all:unset; cursor:pointer; display:flex; align-items:center; gap:8px;
    padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line);
    font-size: 0.82rem; color: var(--text); font-weight:600;
  }
  .theme-toggle:hover{ border-color: var(--muted); }
  .theme-toggle svg{ width:16px; height:16px; }

  /* ---------- layout ---------- */
  .shell{ display:grid; grid-template-columns: 230px 1fr; min-height: calc(100vh - 68px); }
  @media (max-width: 780px){ .shell{ grid-template-columns: 1fr; } }

  /* ---------- sidebar ---------- */
  .sidebar{
    background: var(--panel); border-right: 1px solid var(--line);
    padding: 24px 18px; display:flex; flex-direction:column; gap: 22px;
  }
  .search-box{
    width:100%; padding: 10px 12px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); font-size: 0.9rem;
  }
  .search-box::placeholder{ color: var(--muted); }
  .search-box:focus{ outline: 2px solid var(--plants); outline-offset: 1px; }

  nav.cat-list{ display:flex; flex-direction:column; gap: 4px; }
  nav.cat-list button{
    all:unset; cursor:pointer; display:flex; align-items:center; gap:10px;
    padding: 10px 14px; border-radius: 10px; font-size: 0.95rem; color: var(--text);
  }
  nav.cat-list button .count{
    margin-left:auto; font-family:'IBM Plex Mono', monospace; font-size:0.72rem; color: var(--muted);
  }
  nav.cat-list button:hover{ background: var(--bg); }
  nav.cat-list button[data-active="true"]{ background: var(--plants-t); color:#365a41; font-weight:600; }

  .sidebar-foot{
    margin-top:auto; padding-top:16px; border-top:1px solid var(--line);
    font-family:'IBM Plex Mono', monospace; font-size: 0.74rem; color: var(--muted);
  }

  /* ---------- main ---------- */
  main{ padding: 34px 36px 60px; }
  @media (max-width: 780px){ main{ padding: 24px 18px 50px; } }

  /* ---------- homepage ---------- */
  .home-hero h2{ font-size: 1.9rem; margin: 0 0 8px; }
  .home-hero p{ color: var(--muted); max-width: 56ch; margin: 0 0 30px; font-size: 0.98rem; }

  .home-recent h3{ font-size: 1.1rem; margin: 0 0 14px; }
  .recent-strip{ display:flex; gap:16px; overflow-x:auto; padding-bottom:10px; }
  .recent-strip .card{ flex: 0 0 200px; width:200px; cursor:pointer; }

  /* ---------- category page ---------- */
  .cat-header{
    display:flex; align-items:center; justify-content:space-between; gap: 16px; margin-bottom: 24px; flex-wrap:wrap;
  }
  .cat-header .heading{ display:flex; align-items:center; gap:12px; }
  .cat-header h2{ font-size: 1.6rem; margin:0; }
  .cat-header .sub-count{ font-size:0.82rem; color: var(--muted); font-family:'IBM Plex Mono', monospace; }

  .add-btn, .gallery-add-btn{
    all:unset; cursor:pointer; padding: 10px 18px; border-radius: 10px;
    font-weight:700; font-size:0.88rem; transition: transform 0.12s ease;
    background: var(--plants); color:#fff; display:none;
  }
  .add-btn:hover, .gallery-add-btn:hover{ transform: translateY(-1px); }

  .grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(270px,1fr)); gap:18px; }

  .card{
    background: var(--panel); border:1px solid var(--line); border-radius: var(--radius);
    padding: 0; overflow:hidden; display:flex; flex-direction:column;
    transition: box-shadow 0.12s ease; cursor:pointer;
  }
  .card:hover{ box-shadow: 0 0 0 1px var(--muted), 0 2px 6px rgba(43,58,51,0.18); }
  .card .thumb{ width:100%; height:130px; object-fit:cover; background: var(--bg); display:block; }

  .card-body{ padding: 16px 16px 14px; display:flex; flex-direction:column; gap:8px; flex:1; }
  .card-body .name{ font-family:'Fraunces', serif; font-size:1.08rem; font-weight:600; }
  .card-body .species{ font-size:0.8rem; font-style: italic; color: var(--muted); margin-top:-6px; }

  .card-actions{ display:flex; gap:8px; margin-top:auto; padding-top:12px; }
  .card-actions button{
    all:unset; cursor:pointer; flex:1; text-align:center; padding:7px 0; border-radius:8px;
    font-size:0.78rem; border:1px solid var(--line); color: var(--muted);
  }
  .card-actions button:hover{ color: var(--text); border-color: var(--muted); }
  .card-actions button.danger:hover{ color:#b8493d; border-color:#b8493d; }

  /* ---------- modals ---------- */
  .modal-overlay{
    position: fixed; inset:0; background: rgba(20,26,22,0.72); z-index:40;
    display:flex; align-items:flex-start; justify-content:center; padding: 40px 20px; overflow-y:auto;
  }
  .modal-overlay[hidden]{ display:none; }
  .modal-panel{
    position:relative; background: var(--panel); border-radius: var(--radius);
    max-width: 720px; width:100%; padding: 40px 48px; box-shadow: 0 10px 40px rgba(0,0,0,0.25);
  }
  .modal-close{
    all:unset; position:absolute; top:16px; right:16px; width:34px; height:34px;
    display:flex; align-items:center; justify-content:center; border-radius:50%;
    cursor:pointer; color: var(--muted); font-size:1.4rem;
  }

  .confirm-panel{
    position:relative; background: var(--panel); border-radius: var(--radius);
    max-width: 380px; width:100%; padding: 28px; box-shadow: 0 10px 40px rgba(0,0,0,0.25);
  }
  .confirm-actions{ display:flex; gap:10px; justify-content:flex-end; margin-top:20px; }

  .btn-secondary{ all:unset; cursor:pointer; padding:9px 16px; border-radius:8px; color: var(--muted); border:1px solid var(--line); font-size:0.86rem; background: var(--panel); }
  .btn-primary{ all:unset; cursor:pointer; padding:9px 18px; border-radius:8px; color:#fff; font-weight:700; font-size:0.86rem; }
  .login-input{ width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font-size: 0.9rem; margin-bottom: 12px; }

  .doc-page{
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 40px 48px; max-width: 720px; box-shadow: 0 4px 20px rgba(43,58,51,0.05);
  }
  .doc-title{ font-family:'Fraunces', serif; font-size: 2.1rem; font-weight:600; margin-bottom:6px; }
  .doc-species{ font-family:'Fraunces', serif; font-style: italic; font-size:1.05rem; color: var(--muted); margin-bottom: 22px; }
  .doc-notes{ min-height: 220px; line-height:1.7; font-size:0.98rem; }

  .empty{ grid-column: 1/-1; text-align:center; padding:60px 20px; border: 1px dashed var(--line); border-radius: var(--radius); color: var(--muted); }

  .toast{
    position: fixed; bottom:22px; left:50%; transform: translateX(-50%);
    background: var(--text); color:#fff; font-weight:600; font-size:0.86rem;
    padding: 10px 18px; border-radius:999px; z-index:30; opacity:0; transition: opacity 0.25s ease; pointer-events:none;
  }
  .toast.show{ opacity:1; }
</style>
</head>
<body>

<div class="topbar">
  <button class="brand" id="brandBtn">Fyo Aqua Garden</button>
  <div class="spacer"></div>
  <button class="auth-btn" id="authBtn">Login</button>
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle light and dark mode">
    <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="5"/><path d="M12 1v3M12 20v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M1 12h3M20 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
  </button>
</div>

<div class="shell">
  <aside class="sidebar">
    <input class="search-box" id="searchInput" type="text" placeholder="Search species…">

    <nav class="cat-list" id="catList">
      <button data-cat="Fish"><span>Fish</span><span class="count" id="count-Fish">0</span></button>
      <button data-cat="Plants"><span>Plants</span><span class="count" id="count-Plants">0</span></button>
      <button data-cat="Algae"><span>Algae</span><span class="count" id="count-Algae">0</span></button>
      <button data-cat="Insects"><span>Invertebrates</span><span class="count" id="count-Insects">0</span></button>
    </nav>

    <div class="sidebar-foot" id="sidebarFoot">0 species logged</div>
  </aside>

  <main id="main"></main>
</div>

<div class="modal-overlay" id="speciesModal" hidden>
  <div class="modal-panel" id="speciesModalPanel"></div>
</div>

<div class="modal-overlay" id="loginModal" hidden>
  <div class="confirm-panel">
    <h3>Admin Login</h3>
    <p style="font-size:0.84rem; color:var(--muted); margin-bottom:14px;">Sign in to log and manage entries.</p>
    <input type="email" id="loginEmail" class="login-input" placeholder="Email">
    <input type="password" id="loginPassword" class="login-input" placeholder="Password">
    <div class="confirm-actions">
      <button class="btn-secondary" id="loginCancelBtn">Cancel</button>
      <button class="btn-primary" id="loginSubmitBtn" style="background:var(--plants)">Sign In</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCzBvlxbwP5SZJhEJ9550-Kru7eVmj_9xU",
  authDomain: "fyo-aqua-garden.firebaseapp.com",
  projectId: "fyo-aqua-garden",
  storageBucket: "fyo-aqua-garden.firebasestorage.app",
  messagingSenderId: "593835864414",
  appId: "1:593835864414:web:8abac971960e1b98c4dfcf",
  measurementId: "G-K2ZT95CHDZ"
};

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let entries = [];
  let currentPage = 'home';
  let editing = null;
  let currentUser = null;

  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(()=> t.classList.remove('show'), 1700);
  }

  // Handle Authentication
  onAuthStateChanged(auth, (user) => {
    currentUser = user;
    document.getElementById('authBtn').textContent = user ? 'Logout' : 'Login';
    renderAll();
  });

  document.getElementById('authBtn').addEventListener('click', () => {
    if (currentUser) {
      signOut(auth);
      showToast('Logged out');
    } else {
      document.getElementById('loginModal').hidden = false;
    }
  });

  document.getElementById('loginCancelBtn').addEventListener('click', () => {
    document.getElementById('loginModal').hidden = true;
  });

  document.getElementById('loginSubmitBtn').addEventListener('click', async () => {
    const email = document.getElementById('loginEmail').value;
    const pass = document.getElementById('loginPassword').value;
    try {
      await signInWithEmailAndPassword(auth, email, pass);
      document.getElementById('loginModal').hidden = true;
      showToast('Signed in as admin');
    } catch(err) {
      alert('Login failed: ' + err.message);
    }
  });

  // Real-Time Sync with Firebase Firestore
  onSnapshot(collection(db, "entries"), (snapshot) => {
    entries = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    renderAll();
  });

  function updateCounts(){
    ['Fish','Plants','Algae','Insects'].forEach(cat=>{
      const el = document.getElementById('count-'+cat);
      if(el) el.textContent = entries.filter(e=>e.category===cat).length;
    });
    document.getElementById('sidebarFoot').textContent = `${entries.length} species logged`;
  }

  function updateNavActive(){
    document.querySelectorAll('#catList button').forEach(btn=>{
      btn.dataset.active = (!editing && btn.dataset.cat === currentPage) ? 'true' : 'false';
    });
  }

  function renderAll(){
    updateCounts();
    updateNavActive();
    if(editing){ renderEditor(editing.category, editing.id); return; }
    if(currentPage === 'home') renderHome();
    else renderCategory(currentPage);
  }

  function renderHome(){
    const main = document.getElementById('main');
    const recent = [...entries].sort((a,b)=> (b.createdAt||0) - (a.createdAt||0)).slice(0,10);

    main.innerHTML = `
      <div class="home-hero">
        <h2>Welcome to the Fyo Aqua Garden</h2>
        <p>A catalog of what lives in your freshwater aquarium</p>
      </div>
      ${entries.length ? `
        <div class="home-recent">
          <h3>Most recent logs</h3>
          <div class="recent-strip" id="recentStrip"></div>
        </div>
      ` : ''}
    `;

    if(entries.length){
      const strip = document.getElementById('recentStrip');
      strip.innerHTML = recent.map(e => `
        <div class="card" data-view="${e.id}">
          <div class="card-body">
            <div class="name">${e.name || ''}</div>
            ${e.species ? `<div class="species">${e.species}</div>` : ''}
          </div>
        </div>
      `).join('');
      strip.querySelectorAll('[data-view]').forEach(card=> card.addEventListener('click', ()=> openSpeciesDetail(card.dataset.view)));
    }
  }

  function renderCategory(cat){
    const main = document.getElementById('main');
    const search = document.getElementById('searchInput').value.trim().toLowerCase();
    let list = entries.filter(e => e.category === cat);
    if(search){
      list = list.filter(e => (e.name||'').toLowerCase().includes(search) || (e.species||'').toLowerCase().includes(search));
    }

    main.innerHTML = `
      <div class="cat-header">
        <div class="heading">
          <div>
            <h2>${cat}</h2>
            <div class="sub-count">${list.length} logged</div>
          </div>
        </div>
        ${currentUser ? `<button class="add-btn" id="addBtn" style="display:inline-block;">+ Log entry</button>` : ''}
      </div>
      <div class="grid" id="catGrid"></div>
    `;

    const grid = document.getElementById('catGrid');
    if(list.length === 0){
      grid.innerHTML = `<div class="empty"><h3>Nothing logged yet</h3></div>`;
    } else {
      grid.innerHTML = list.map(e => `
        <div class="card" data-view="${e.id}">
          <div class="card-body">
            <div class="name">${e.name || ''}</div>
            ${e.species ? `<div class="species">${e.species}</div>` : ''}
          </div>
        </div>
      `).join('');
    }

    const addBtn = document.getElementById('addBtn');
    if(addBtn) addBtn.addEventListener('click', ()=> openEditor(null, cat));
    grid.querySelectorAll('[data-view]').forEach(card=> card.addEventListener('click', ()=> openSpeciesDetail(card.dataset.view)));
  }

  function openSpeciesDetail(id){
    const e = entries.find(x=>x.id===id);
    if(!e) return;
    const panel = document.getElementById('speciesModalPanel');
    panel.innerHTML = `
      <button class="modal-close" id="speciesModalClose" aria-label="Close">&times;</button>
      <div class="doc-title">${e.name || ''}</div>
      ${e.species ? `<div class="doc-species">${e.species}</div>` : ''}
      ${e.notes ? `<div style="border-top:1px solid var(--line-2); padding-top:14px; margin-top:14px;">${e.notes}</div>` : ''}
      ${currentUser ? `
        <div class="card-actions">
          <button id="speciesModalEdit">Edit</button>
          <button class="danger" id="speciesModalDelete">Remove</button>
        </div>
      ` : ''}
    `;
    document.getElementById('speciesModalClose').addEventListener('click', ()=> document.getElementById('speciesModal').hidden = true);
    
    if (currentUser) {
      document.getElementById('speciesModalEdit').addEventListener('click', ()=>{
        document.getElementById('speciesModal').hidden = true;
        openEditor(e.id, e.category);
      });
      document.getElementById('speciesModalDelete').addEventListener('click', async ()=>{
        if (confirm("Delete this entry?")) {
          await deleteDoc(doc(db, "entries", e.id));
          document.getElementById('speciesModal').hidden = true;
          showToast('Deleted');
        }
      });
    }
    document.getElementById('speciesModal').hidden = false;
  }

  function renderEditor(cat, id){
    const main = document.getElementById('main');
    const existing = id ? entries.find(x=>x.id===id) : null;

    main.innerHTML = `
      <div style="display:flex; justify-content:flex-end; gap:10px; margin-bottom:20px;">
        <button type="button" class="btn-secondary" id="cancelEditBtn">Cancel</button>
        <button type="button" class="btn-primary" id="saveEditBtn" style="background:var(--plants)">Save Entry</button>
      </div>

      <div class="doc-page">
        <div class="doc-title" id="docName" contenteditable="true" data-placeholder="Name">${existing ? existing.name : ''}</div>
        <div class="doc-species" id="docSpecies" contenteditable="true" data-placeholder="Species (scientific name)">${existing ? existing.species||'' : ''}</div>
        <div class="doc-notes" id="docNotes" contenteditable="true" data-placeholder="Write your notes here...">${existing ? existing.notes||'' : ''}</div>
      </div>
    `;

    document.getElementById('cancelEditBtn').addEventListener('click', ()=>{
      editing = null;
      renderAll();
    });

    document.getElementById('saveEditBtn').addEventListener('click', async ()=>{
      const name = document.getElementById('docName').textContent.trim();
      if(!name){ alert("Name required"); return; }

      const entryId = existing ? existing.id : 'e_' + Date.now();
      const data = {
        id: entryId,
        category: cat,
        name: name,
        species: document.getElementById('docSpecies').textContent.trim(),
        notes: document.getElementById('docNotes').innerHTML.trim(),
        createdAt: existing && existing.createdAt ? existing.createdAt : Date.now()
      };

      // Saves directly to Cloud Firestore
      await setDoc(doc(db, "entries", entryId), data);
      editing = null;
      currentPage = cat;
      renderAll();
      showToast('Saved');
    });
  }

  function openEditor(id, cat){
    editing = { id, category: cat };
    renderAll();
  }

  document.getElementById('brandBtn').addEventListener('click', ()=>{
    editing = null;
    currentPage = 'home';
    renderAll();
  });

  document.getElementById('catList').addEventListener('click', (e)=>{
    const btn = e.target.closest('button[data-cat]');
    if(!btn) return;
    editing = null;
    currentPage = btn.dataset.cat;
    renderAll();
  });

  document.getElementById('searchInput').addEventListener('input', renderAll);

  document.getElementById('themeToggle').addEventListener('click', ()=>{
    const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
  });
</script>

</body>
</html>
